<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#7b2d8e">
    <title>Graphe</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar - notes list -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Graphe</h2>
            <button id="btn-new-note" class="btn-icon" title="Nowa notatka">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </div>
        <div id="notes-list" class="notes-list"></div>
    </aside>

    <!-- Main area -->
    <main id="main" class="main">
        <!-- Top bar -->
        <header class="top-bar">
            <button id="btn-menu" class="btn-icon" title="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div class="note-meta">
                <span id="note-date" class="meta-date"></span>
                <span id="note-location" class="meta-location"></span>
            </div>
            <div class="toolbar">
                <button id="btn-pen" class="btn-tool active" title="Pisak" data-tool="pen">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                        <path d="M2 2l7.586 7.586"></path>
                        <circle cx="11" cy="11" r="2"></circle>
                    </svg>
                </button>
                <button id="btn-highlighter" class="btn-tool" title="Zakreślacz" data-tool="highlighter">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 11l-6 6v3h9l3-3"></path>
                        <path d="M22 12l-4.6 4.6a2 2 0 01-2.8 0l-5.2-5.2a2 2 0 010-2.8L14 4"></path>
                    </svg>
                </button>
                <button id="btn-eraser" class="btn-tool" title="Gumka" data-tool="eraser">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 20H7L3 16l9-9 8 8-4 4z"></path>
                        <path d="M6 11l8 8"></path>
                    </svg>
                </button>
                <div class="color-picker">
                    <button class="btn-color active" data-color="#1a1a2e" style="background:#1a1a2e" title="Czarny"></button>
                    <button class="btn-color" data-color="#0066cc" style="background:#0066cc" title="Niebieski"></button>
                    <button class="btn-color" data-color="#cc0000" style="background:#cc0000" title="Czerwony"></button>
                    <button class="btn-color" data-color="#008844" style="background:#008844" title="Zielony"></button>
                    <button class="btn-color" data-color="#ff8800" style="background:#ff8800" title="Pomarańczowy"></button>
                </div>
                <input type="range" id="pen-size" min="1" max="12" value="2" class="pen-size-slider" title="Grubość">
                <button id="btn-recognize" class="btn-action" title="Rozpoznaj pismo">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                    <span>Rozpoznaj</span>
                </button>
                <button id="btn-undo" class="btn-icon" title="Cofnij">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="1 4 1 10 7 10"></polyline>
                        <path d="M3.51 15a9 9 0 102.13-9.36L1 10"></path>
                    </svg>
                </button>
                <button id="btn-redo" class="btn-icon" title="Ponów">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 11-2.13-9.36L23 10"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Quote banner -->
        <div id="quote-banner" class="quote-banner">
            <p id="quote-text" class="quote-text"></p>
            <span id="quote-author" class="quote-author"></span>
        </div>

        <!-- Canvas area -->
        <div id="canvas-container" class="canvas-container">
            <canvas id="drawing-canvas"></canvas>
        </div>

        <!-- Recognized text panel -->
        <div id="recognized-panel" class="recognized-panel hidden">
            <div class="recognized-header">
                <h3>Rozpoznany tekst</h3>
                <button id="btn-close-recognized" class="btn-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="recognized-text" class="recognized-text"></div>
            <div class="recognized-actions">
                <button id="btn-copy-text" class="btn-secondary">Kopiuj tekst</button>
                <button id="btn-correct-text" class="btn-secondary">Popraw rozpoznanie</button>
            </div>
        </div>
    </main>

    <!-- Correction modal for handwriting learning -->
    <div id="correction-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Popraw rozpoznany tekst</h3>
            <p class="modal-hint">Poprawiony tekst pomoże mi lepiej rozpoznawać Twoje pismo w przyszłości.</p>
            <textarea id="correction-input" class="correction-input" rows="4"></textarea>
            <div class="modal-actions">
                <button id="btn-cancel-correction" class="btn-secondary">Anuluj</button>
                <button id="btn-save-correction" class="btn-primary">Zapisz i ucz się</button>
            </div>
        </div>
    </div>

    <script src="js/quotes.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/drawing.js"></script>
    <script src="js/recognition.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
